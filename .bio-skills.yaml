# .bio-skills.yaml : read by every bio-* skill. Missing file = restricted.
version: 1

project_types: [python-package, snakemake-pipeline]
languages: [python]

data_policy: open                   # see docs/adr/0001-data-policy.md

github:
  repo: antunderwood/chamredb
  labels:
    spec: "bio:spec"
    ticket: "bio:ticket"
    decision: "bio:decision"
    needs_human: "bio:needs-human"
    ready_for_agent: "bio:ready-for-agent"
    science_review: "bio:science-review"

reference: none                     # protein/nucleotide ARG databases, no genome assembly

paths:
  glossary: GLOSSARY.md
  adr_dir: docs/adr
  fixtures: chamredb/tests/test_data
  lab_log: analysis/LOG.md
  figures: figures

science_reviewer: "@antunderwood"
science_reviewer_backup: none

executors: [local]

feedback_loop:
  max_seconds: 60
