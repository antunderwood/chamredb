image : continuumio/miniconda3:4.10.3-alpine

stages:
  - build

graph.json:
  stage: build
  script:
    - conda env create --file environment.yml && conda clean --all
    - conda run --no-capture-output -n chamredb snakemake --verbose --cores 1  --latency-wait 60
    - conda run --no-capture-output -n chamredb python scripts/build_graph.py
  artifacts:
    paths:
    - graph.json
    expire_in: never
