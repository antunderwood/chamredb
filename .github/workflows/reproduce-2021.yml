name: reproduce-2021

# Manual: rebuild the shipped 2021 graph from archived inputs and compare (ADR 0003 step 1, ticket #2).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - builder/reproduce_2021/**
      - builder/scripts/**
      - .github/workflows/reproduce-2021.yml

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: mamba-org/setup-micromamba@f8b8a1e23a26f60a44c853292711bacfd3eac822 # v1.9.0
        with:
          environment-file: builder/environment.yml
          environment-name: chamredb
          cache-environment: true
      - name: Comparison tests
        shell: micromamba-shell {0}
        run: python -m pytest -p no:cacheprovider -q builder/tests/test_graph_compare.py
      - name: Rebuild and compare
        shell: micromamba-shell {0}
        run: |
          set +e
          bash builder/reproduce_2021/run_reproduction.sh "$RUNNER_TEMP/repro"
          status=$?
          { cat "$RUNNER_TEMP/repro/report.md"; echo; echo '```'; cat "$RUNNER_TEMP/repro/timings.txt" "$RUNNER_TEMP/repro/versions.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        if: always()
        with:
          name: reproduction-2021
          path: |
            ${{ runner.temp }}/repro/graph.json
            ${{ runner.temp }}/repro/report.md
            ${{ runner.temp }}/repro/data_manifest.json
            ${{ runner.temp }}/repro/timings.txt
            ${{ runner.temp }}/repro/versions.txt
