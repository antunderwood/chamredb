name: refresh-card

# ADR 0003 step 2, ticket #12: change one thing at a time. Both builds use MMseqs2 18 (builder/environment.yml).
#   baseline : 2021 inputs (CARD 3.1.4 with its own ontology, NCBI 2021-09-30.1, ResFinder 7562716)
#   candidate: CARD 4.0.2 (data and ontology from the same release), NCBI and ResFinder as in the baseline
# The diff job compares candidate with baseline, so every difference is attributable to CARD alone.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - builder/refresh/**
      - builder/scripts/functions/obo_cleaning.py
      - builder/scripts/parse_card_metadata.py
      - .github/workflows/refresh-card.yml

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            inputs: builder/reproduce_2021/inputs.json
          - name: candidate
            inputs: builder/refresh/inputs_card402.json
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: mamba-org/setup-micromamba@f8b8a1e23a26f60a44c853292711bacfd3eac822 # v1.9.0
        with:
          environment-file: builder/environment.yml
          environment-name: chamredb
          cache-environment: true
      - name: Build ${{ matrix.name }}
        shell: micromamba-shell {0}
        run: |
          set +e
          REPORT_ONLY=1 INPUTS="$GITHUB_WORKSPACE/${{ matrix.inputs }}" bash builder/reproduce_2021/run_reproduction.sh "$RUNNER_TEMP/${{ matrix.name }}"
          status=$?
          { echo "## ${{ matrix.name }}"; cat "$RUNNER_TEMP/${{ matrix.name }}/invariants.txt" "$RUNNER_TEMP/${{ matrix.name }}/timings.txt" "$RUNNER_TEMP/${{ matrix.name }}/versions.txt"; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ runner.temp }}/${{ matrix.name }}/graph.json
            ${{ runner.temp }}/${{ matrix.name }}/data_manifest.json
            ${{ runner.temp }}/${{ matrix.name }}/invariants.txt
            ${{ runner.temp }}/${{ matrix.name }}/timings.txt
            ${{ runner.temp }}/${{ matrix.name }}/versions.txt

  diff:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
      - name: Diff candidate against baseline
        run: |
          python3 builder/scripts/diff_graphs.py artifacts/baseline/graph.json artifacts/candidate/graph.json --out card-refresh-report.md --json card-refresh-diff.json
          cat card-refresh-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        with:
          name: card-refresh-report
          path: |
            card-refresh-report.md
            card-refresh-diff.json
