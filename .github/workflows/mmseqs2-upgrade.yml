name: mmseqs2-upgrade

# ADR 0003 step 2 (ticket #11): rebuild the graph from the same 2021 inputs with the upgraded MMseqs2 and
# write a diff report against the shipped graph for the science reviewer. Informational: differences are
# expected; only the graph invariants must hold.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - builder/environment-mmseqs18.yml
      - .github/workflows/mmseqs2-upgrade.yml

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: mamba-org/setup-micromamba@f8b8a1e23a26f60a44c853292711bacfd3eac822 # v1.9.0
        with:
          environment-file: builder/environment-mmseqs18.yml
          environment-name: chamredb-mmseqs18
          cache-environment: true
      - name: Environment pin tests
        shell: micromamba-shell {0}
        run: python -m pytest -p no:cacheprovider -q builder/tests/test_environment_pins.py builder/tests/test_graph_diff.py
      - name: Rebuild with the upgraded MMseqs2 and diff against the shipped graph
        shell: micromamba-shell {0}
        run: |
          set +e
          REPORT_ONLY=1 bash builder/reproduce_2021/run_reproduction.sh "$RUNNER_TEMP/repro18"
          status=$?
          { cat "$RUNNER_TEMP/repro18/report.md"; echo; echo '```'; cat "$RUNNER_TEMP/repro18/invariants.txt" "$RUNNER_TEMP/repro18/timings.txt" "$RUNNER_TEMP/repro18/versions.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        if: always()
        with:
          name: mmseqs2-upgrade-report
          path: |
            ${{ runner.temp }}/repro18/graph.json
            ${{ runner.temp }}/repro18/report.md
            ${{ runner.temp }}/repro18/invariants.txt
            ${{ runner.temp }}/repro18/timings.txt
            ${{ runner.temp }}/repro18/versions.txt
