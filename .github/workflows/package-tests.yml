name: package-tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.10", "3.x"]   # oldest supported and newest stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package (non-editable, as a user would)
        run: python -m pip install . pytest
      - name: Tests against the installed package
        # run outside the checkout so the installed chamredb (with its packaged graph) is imported
        working-directory: ${{ runner.temp }}
        run: python -m pytest -p no:cacheprovider -q "$GITHUB_WORKSPACE/chamredb/tests"
