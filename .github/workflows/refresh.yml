name: refresh

# ADR 0003 step 2: change one thing at a time. Both builds use MMseqs2 18 (builder/environment.yml).
#   baseline : the previous accepted inputs (default: CARD 4.0.2 and NCBI 2026-10-29.1, both accepted, with 2021 ResFinder)
#   candidate: one database changed (default: ResFinder db 2.6.0 current commit, ticket #14)
# The diff job compares candidate with baseline, so every difference is attributable to that one change.
# Run by hand with other inputs files: gh workflow run refresh.yml -f baseline=builder/refresh/X.json -f candidate=...
on:
  workflow_dispatch:
    inputs:
      baseline:
        default: builder/refresh/inputs_ncbi.json
      candidate:
        default: builder/refresh/inputs_resfinder.json
  pull_request:
    paths:
      - builder/refresh/**
      - builder/scripts/resfinder_orfs_to_proteins.py
      - builder/scripts/parse_resfinder_metadata.py
      - builder/reproduce_2021/fetch_inputs.py
      - .github/workflows/refresh.yml

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            inputs: ${{ inputs.baseline || 'builder/refresh/inputs_ncbi.json' }}
          - name: candidate
            inputs: ${{ inputs.candidate || 'builder/refresh/inputs_resfinder.json' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: mamba-org/setup-micromamba@f8b8a1e23a26f60a44c853292711bacfd3eac822 # v1.9.0
        with:
          environment-file: builder/environment.yml
          environment-name: chamredb
          cache-environment: true
      - name: Build ${{ matrix.name }}
        shell: micromamba-shell {0}
        run: |
          set +e
          REPORT_ONLY=1 INPUTS="$GITHUB_WORKSPACE/${{ matrix.inputs }}" bash builder/reproduce_2021/run_reproduction.sh "$RUNNER_TEMP/${{ matrix.name }}"
          status=$?
          { echo "## ${{ matrix.name }}"; cat "$RUNNER_TEMP/${{ matrix.name }}/invariants.txt" "$RUNNER_TEMP/${{ matrix.name }}/timings.txt" "$RUNNER_TEMP/${{ matrix.name }}/versions.txt"; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ runner.temp }}/${{ matrix.name }}/graph.json
            ${{ runner.temp }}/${{ matrix.name }}/data_manifest.json
            ${{ runner.temp }}/${{ matrix.name }}/invariants.txt
            ${{ runner.temp }}/${{ matrix.name }}/timings.txt
            ${{ runner.temp }}/${{ matrix.name }}/versions.txt

  diff:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
      - name: Diff candidate against baseline
        run: |
          python3 builder/scripts/diff_graphs.py artifacts/baseline/graph.json artifacts/candidate/graph.json --out refresh-report.md --json refresh-diff.json
          cat refresh-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        with:
          name: refresh-report
          path: |
            refresh-report.md
            refresh-diff.json
