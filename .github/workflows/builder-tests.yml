name: builder-tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: mamba-org/setup-micromamba@f8b8a1e23a26f60a44c853292711bacfd3eac822 # v1.9.0
        with:
          environment-file: builder/environment.yml
          environment-name: chamredb
          cache-environment: true
      - name: Fixture build and tests
        shell: micromamba-shell {0}
        run: |
          start=$(date +%s)
          make test
          echo "make test took $(( $(date +%s) - start )) s (target 60 s)" | tee -a "$GITHUB_STEP_SUMMARY"
