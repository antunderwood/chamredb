image : mambaorg/micromamba:0.17.0

stages:
  - package

package:
  stage: package
  script:
    - micromamba create --file environment.yml --yes && micromamba clean --all --yes
    - ./bin/micromamba shell init -s bash -p ~/micromamba
    - source ~/.bashrc
    - micromamba chamredb
  artifacts:
    paths:
    - packaged.gz
