image : mambaorg/micromamba:0.17.0

stages:
  - package

package:
  stage: package
  script:
    - micromamba create --file environment.yml --yes && micromamba clean --all --yes
    - eval "$(micromamba shell hook -s bash)" && micromamba activate chamredb
    - snakemake --cores 1  --latency-wait 60
    - ls
  artifacts:
    paths:
    - packaged.gz
