image : continuumio/miniconda3:4.10.3-alpine

stages:
  - package

package:
  stage: package
  script:
    - conda env create --file environment.yml && conda clean --all
    - conda run  --no-capture-output -n chamredb snakemake --cores 1  --latency-wait 60
    - ls
  artifacts:
    paths:
    - packaged.gz
