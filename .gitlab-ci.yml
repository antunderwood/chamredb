image : mambaorg/micromamba:0.17.0

stages:
  - package

package:
  stage: package
  script:
    - micromamba install --file environment.yml && micromamba clean --all
    - eval "$(micromamba shell hook -s bash)"
    - snakemake --cores 1  --latency-wait 60
    - ls
  artifacts:
    paths:
    - packaged.gz
